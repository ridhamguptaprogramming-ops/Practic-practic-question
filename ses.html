<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .login-box {
            width: 900px;
            border: 2px solid black;
            padding: 15px;
        }
        h2 {
            margin-top: 0;
        }
        .form-row {
            margin: 20px 0;
        }
        label {
            display: inline-block;
            width: 90px;
        }
        input {
            padding: 5px;
            width: 180px;
        }
        button {
            padding: 5px 12px;
            cursor: pointer;
        }
        #message {
            margin-top: 20px;
            font-size: 16px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login Form</h2>
        <form id="loginForm">
            <div class="form-row">
                <label for="username">Username:</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                >
            </div>
            <div class="form-row">
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                >
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="message"></div>
    </div>
    <script>
        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const message = document.getElementById("message");
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const username = usernameInput.value;
            const password = passwordInput.value;
            const usernameRegex = /^[A-Za-z][A-Za-z0-9_]{4,14}$/;
            const passwordRegex =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&*!])[A-Za-z\d@#$%^&*!]{8,}$/;
            if (!usernameRegex.test(username)) {
                message.textContent =
                    "Invalid Username! Username must be 5-15 characters, start with a letter, and contain only letters, numbers, and underscores.";
                message.className = "error";
                return;
            }
            if (!passwordRegex.test(password)) {
                message.textContent =
                    "Invalid Password! Password must contain at least 8 characters, including uppercase, lowercase, number, and special character.";
                message.className = "error";
                return;
            }
            message.textContent = "Login Successful";
            message.className = "success";
        });
    </script>
</body>
</html>
