<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vote Page</title>
    <style>
        .vote {
            color: white;
            background-color: blue;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
        }

        .vote:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <h1>Vote Your Choice</h1>

    <p>Option A: <button class="vote">Vote (<span>2</span>)</button></p>
    <p>Option B: <button class="vote">Vote (<span>1</span>)</button></p>
    <p>Option C: <button class="vote">Vote (<span>1</span>)</button></p>

    <script>
        const voteButtons = document.querySelectorAll('.vote');

        voteButtons.forEach(button => {
            button.addEventListener('click', () => {
                let countSpan = button.querySelector('span');
                let count = parseInt(countSpan.innerText);
                countSpan.innerText = count + 1;

                alert('Thank you for voting!');
            });
        });
    </script>

</body>
</html>
